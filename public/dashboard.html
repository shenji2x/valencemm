<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Valence MM</title>
  <meta name="description" content="Your Valence MM balance, deals, stats and support.">
  <meta name="theme-color" content="#060a16">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://valencemm.com/dashboard">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Valence MM">
  <meta property="og:title" content="Dashboard | Valence MM">
  <meta property="og:description" content="Your Valence MM balance, deals, stats and support.">
  <meta property="og:url" content="https://valencemm.com/dashboard">
  <meta property="og:image" content="https://valencemm.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="dashboard">
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Dashboard menu">
      <a class="logo" href="/"><img src="/logo.svg" alt="" width="30" height="30"><span>Valence MM</span></a>
      <nav aria-label="Dashboard">
        <div class="side-group">Dashboard</div>
        <a href="#overview" data-view="overview"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M4 16l5-5 4 3 4.2-4.8M17.6 7.2a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0 -3.2 0"/></svg>Overview</a>
        <a href="#stats" data-view="stats"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M6 20v-5M11 20V9M16 20v-6M17.2 5.6a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0 -3.2 0"/></svg>Stats</a>
        <div class="side-group">Deals</div>
        <a href="#new" data-view="new"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.83 10.28A9 9 0 1 1 13.72 3.17M16.66 5.636038969321072a1.7 1.7 0 1 0 3.4 0a1.7 1.7 0 1 0 -3.4 0M12 8v8M8 12h8"/></svg>New deal</a>
        <a href="#join" data-view="join"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h8M8 8.5l3.5 3.5L8 15.5M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg>Join a deal</a>
        <a href="#deals" data-view="deals"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 11V8a4.5 4.5 0 0 1 9 0v3M5 11h14v10H5zM10.4 16a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0 -3.2 0"/></svg>Active deals<span class="count" id="count-active" hidden></span></a>
        <a href="#history" data-view="history"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3L3.5 8.3M3.5 3.5v4.8h4.8M12 8v4l2.8 2"/></svg>Past deals</a>
        <a href="#payments" data-view="payments"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v13H3zM3 10.5h18M6.5 15h4M15.7 15a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0 -2.6 0"/></svg>Payments</a>
        <div class="side-group">Help</div>
        <a href="#support" data-view="support"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.5L3.5 21l1.4-4.6A8.5 8.5 0 1 1 20.5 12zM10.6 12a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0 -2.8 0"/></svg>Support<span class="count" id="count-support" hidden></span></a>
        <a href="#faq" data-view="faq"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.83 10.28A9 9 0 1 1 13.72 3.17M16.66 5.636038969321072a1.7 1.7 0 1 0 3.4 0a1.7 1.7 0 1 0 -3.4 0M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 17.3h.01"/></svg>FAQ</a>
        <div class="side-group">Account</div>
        <a href="#settings" data-view="settings"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h8.5M17.5 7H21M3 17h3.5M12.5 17H21M11.9 7a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0 -5.2 0M6.9 17a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0 -5.2 0"/></svg>Settings</a>
      </nav>
      <div class="side-foot">
        <a class="btn secondary small block" href="https://discord.gg/eVYyxbyy22" target="_blank" rel="noopener">Join our Discord</a>
        <div class="me">
          <span class="avatar" id="me-avatar" aria-hidden="true"></span>
          <div><strong id="me-name">Loading...</strong><small id="me-kind"></small></div>
          <button class="icon-btn" type="button" id="logout" aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="app-main">
      <header class="app-top">
        <button class="icon-btn burger" type="button" id="burger" aria-label="Open menu" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="page-ico" id="page-ico" aria-hidden="true"></span>
        <h1 id="page-title">Dashboard</h1>
        <span class="spacer"></span>
        <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn small outline signout" type="button" id="top-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sign out</span></button>
      </header>
      <main class="view" id="view" tabindex="-1">
        <p class="muted">Loading...</p>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/vendor/qrcode.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
