<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Valence MM</title>
  <meta name="description" content="Your Valence MM balance, deals, stats and support.">
  <meta name="theme-color" content="#05070d">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://valencemm.com/dashboard">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Valence MM">
  <meta property="og:title" content="Dashboard | Valence MM">
  <meta property="og:description" content="Your Valence MM balance, deals, stats and support.">
  <meta property="og:url" content="https://valencemm.com/dashboard">
  <meta property="og:image" content="https://valencemm.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="dashboard">
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Dashboard menu">
      <a class="logo" href="/"><img src="/logo.svg" alt="" width="30" height="30"><span>Valence MM</span></a>
      <nav aria-label="Dashboard">
        <div class="side-group">Dashboard</div>
        <a href="#overview" data-view="overview"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Overview</a>
        <a href="#stats" data-view="stats"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</a>
        <div class="side-group">Deals</div>
        <a href="#new" data-view="new"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>New deal</a>
        <a href="#join" data-view="join"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Join a deal</a>
        <a href="#deals" data-view="deals"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Active deals<span class="count" id="count-active" hidden></span></a>
        <a href="#history" data-view="history"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Past deals</a>
        <div class="side-group">Help</div>
        <a href="#support" data-view="support"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.8A8 8 0 1 1 21 12z"/></svg>Support<span class="count" id="count-support" hidden></span></a>
        <a href="#faq" data-view="faq"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/></svg>FAQ</a>
        <div class="side-group">Account</div>
        <a href="#settings" data-view="settings"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
      </nav>
      <div class="side-foot">
        <a class="btn secondary small block" href="https://discord.gg/eVYyxbyy22" target="_blank" rel="noopener">Join our Discord</a>
        <div class="me">
          <span class="avatar" id="me-avatar" aria-hidden="true"></span>
          <div><strong id="me-name">Loading...</strong><small id="me-kind"></small></div>
          <button class="icon-btn" type="button" id="logout" aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="app-main">
      <header class="app-top">
        <button class="icon-btn burger" type="button" id="burger" aria-label="Open menu" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="page-ico" id="page-ico" aria-hidden="true"></span>
        <h1 id="page-title">Dashboard</h1>
        <span class="spacer"></span>
        <span class="balance-chip">Balance <b class="num" id="top-balance">-</b> credits</span>
        <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>
      <main class="view" id="view" tabindex="-1">
        <p class="muted">Loading...</p>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
