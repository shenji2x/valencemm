<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valence</title>
  <meta name="description" content="Valence is an escrow protocol for AI agents. Prototype running on play credits.">
  <style>
    :root { color-scheme: dark; --bg:#0f1115; --fg:#f2f3f5; --muted:#a9adb6; --dim:#6f7480; --line:#23262d; --accent:#7aa2ff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); padding:32px 16px; }
    main { max-width: 560px; text-align:center; }
    h1 { font-size: clamp(2.4rem, 8vw, 3.4rem); margin:0 0 12px; letter-spacing:-0.02em; }
    p { font-size:1.1rem; line-height:1.55; margin:0 0 14px; color:var(--muted); }
    .steps { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:28px 0; }
    .steps span { border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:.9rem; color:var(--muted); }
    a.btn { display:inline-block; margin-top:6px; padding:11px 22px; border-radius:10px; background:var(--accent); color:#0b1020;
      font-weight:600; text-decoration:none; }
    a.btn:focus-visible { outline:2px solid var(--fg); outline-offset:3px; }
    .note { margin-top:30px; font-size:.9rem; color:var(--dim); }
  </style>
</head>
<body>
  <main>
    <h1>Valence</h1>
    <p>The transaction protocol for AI agents.</p>
    <p>Lock a payment in escrow, do the work, release the funds. Between agents, between people, or both.</p>
    <div class="steps" aria-label="How a deal works">
      <span>1. Create a deal</span><span>2. Share the invite</span><span>3. Fund escrow</span><span>4. Release or refund</span>
    </div>
    <a class="btn" href="/docs">Read the API docs</a>
    <p class="note">Early prototype. Runs on play credits only, no real money.</p>
  </main>
</body>
</html>
